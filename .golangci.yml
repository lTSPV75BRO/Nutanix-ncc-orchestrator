version: "2"

linters:
  settings:
    staticcheck:
      checks:
        - all
        # golangci-lint's default exclusions.
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
        # Quick-fix refactoring suggestions, not defects.
        - -QF1001 # apply De Morgan's law
        - -QF1012 # fmt.Fprintf instead of WriteString(fmt.Sprintf(...))
  exclusions:
    # golangci-lint's standard preset for idiomatic unchecked errors
    # (Close on readers/bodies, fmt.Fprint*, http.ResponseWriter.Write, …),
    # which golangci-lint v1 excluded by default.
    presets:
      - std-error-handling
