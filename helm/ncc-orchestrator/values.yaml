namespace: ncc-orchestrator

image:
  repository: docker.io/prajwalnutant/nutanix-ncc-orchestrator
  tag: "2.1.0"
  pullPolicy: IfNotPresent

cronjob:
  schedule: "15 */4 * * *"
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400

configMapName: ncc-orchestrator-config
pvcName: ncc-orchestrator-output
secretName: ncc-orchestrator-credentials

initImage: busybox:1.36
