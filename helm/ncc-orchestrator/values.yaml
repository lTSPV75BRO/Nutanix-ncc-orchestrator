namespace: ncc-orchestrator-v2

images:
  runner:
    repository: docker.io/prajwalnutant/nutanix-ncc-orchestrator
    tag: "2.3.0"
    pullPolicy: IfNotPresent
  api:
    repository: docker.io/prajwalnutant/ncc-api-server
    tag: "2.3.0"
    pullPolicy: IfNotPresent
  ui:
    repository: docker.io/prajwalnutant/ncc-ui-server
    tag: "2.3.0"
    pullPolicy: IfNotPresent

image:
  repository: docker.io/prajwalnutant/nutanix-ncc-orchestrator
  tag: "2.3.0"
  pullPolicy: IfNotPresent

cronjob:
  schedule: "15 */4 * * *"
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  startingDeadlineSeconds: 900

api:
  enabled: true
  replicas: 2
  service:
    port: 8081
  # Peers whose X-Forwarded-For is honored for client-IP rate limiting and
  # login throttling. "private,loopback" keeps the pre-2.2.1 behavior; set it to
  # your pod/ingress CIDRs (e.g. "10.244.0.0/16") so other in-cluster clients
  # cannot spoof their source address.
  trustedProxyCIDRs: "private,loopback"

ui:
  enabled: true
  replicas: 2
  service:
    type: LoadBalancer
    port: 80
  origin: https://ncc.example.com

ingress:
  enabled: false
  className: nginx
  host: ncc.example.com
  tlsSecret: ncc-v2-ui-tls
  certManager:
    enabled: false
    clusterIssuer: letsencrypt-prod

# Sizing: the api-server keeps the latest report and alert history parsed in
# memory — ~1 GiB measured at 7,000 clusters / 200k findings, well under
# 256Mi for small fleets. When setting a memory limit for the api, also set
# apiGoMemLimit to ~90% of it so the Go heap stays under the limit.
resources:
  api: {}
  ui: {}

# GOMEMLIMIT for the api-server, e.g. "1800MiB" with a 2Gi limit. Empty = unset.
apiGoMemLimit: ""

configMapName: ncc-orchestrator-config
pvcName: ncc-orchestrator-output
secretName: ncc-orchestrator-credentials

initImage: busybox:1.37
