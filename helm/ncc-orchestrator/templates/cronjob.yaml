apiVersion: batch/v1
kind: CronJob
metadata:
  name: ncc-orchestrator
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: ncc-orchestrator
spec:
  schedule: {{ .Values.cronjob.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: {{ .Values.cronjob.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.cronjob.failedJobsHistoryLimit }}
  startingDeadlineSeconds: {{ .Values.cronjob.startingDeadlineSeconds }}
  jobTemplate:
    spec:
      backoffLimit: {{ .Values.cronjob.backoffLimit }}
      activeDeadlineSeconds: 7200
      ttlSecondsAfterFinished: {{ .Values.cronjob.ttlSecondsAfterFinished }}
      template:
        metadata:
          labels:
            app: ncc-orchestrator
            component: runner
        spec:
          serviceAccountName: ncc-v2-runner
          automountServiceAccountToken: false
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            - name: seed-config
              image: busybox:1.36
              command: ["sh", "-c", "mkdir -p /data/config && test -f /data/config/config.yaml || cp /config-cm/config.yaml /data/config/config.yaml"]
              volumeMounts:
                - { name: config-cm, mountPath: /config-cm, readOnly: true }
                - { name: output, mountPath: /data }
          containers:
            - name: ncc-orchestrator
              image: "{{ .Values.images.runner.repository }}:{{ .Values.images.runner.tag }}"
              imagePullPolicy: {{ .Values.images.runner.pullPolicy }}
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              args: ["--config", "/data/config/config.yaml"]
              env:
                - name: NCC_RUNTIME_MODE
                  value: kubernetes
                - name: NCC_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.secretName }}
                      key: password
              volumeMounts:
                - name: output
                  mountPath: /data
          volumes:
            - name: config-cm
              configMap:
                name: {{ .Values.configMapName }}
            - name: output
              persistentVolumeClaim:
                claimName: {{ .Values.pvcName }}
