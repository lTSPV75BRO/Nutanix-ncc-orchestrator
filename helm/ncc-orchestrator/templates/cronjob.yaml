apiVersion: batch/v1
kind: CronJob
metadata:
  name: ncc-orchestrator
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: ncc-orchestrator
spec:
  schedule: {{ .Values.cronjob.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: {{ .Values.cronjob.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.cronjob.failedJobsHistoryLimit }}
  jobTemplate:
    spec:
      backoffLimit: {{ .Values.cronjob.backoffLimit }}
      ttlSecondsAfterFinished: {{ .Values.cronjob.ttlSecondsAfterFinished }}
      template:
        metadata:
          labels:
            app: ncc-orchestrator
            component: runner
        spec:
          restartPolicy: OnFailure
          initContainers:
            - name: create-dirs
              image: {{ .Values.initImage | quote }}
              command: ["sh", "-c", "mkdir -p /data/logs /data/nccfiles /data/outputfiles /data/promfiles && rm -f /data/logs/ncc-runner.log /data/nccfiles/*.log /data/outputfiles/*.log /data/outputfiles/index.html /data/outputfiles/*.log.html /data/outputfiles/*.log.csv /data/outputfiles/*.log.json /data/promfiles/*.prom && chmod -R 777 /data 2>/dev/null || true"]
              volumeMounts:
                - name: output
                  mountPath: /data
          containers:
            - name: ncc-orchestrator
              image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              args:
                - "--config"
                - "/config/config.yaml"
              env:
                - name: NCC_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.secretName }}
                      key: password
              volumeMounts:
                - name: config
                  mountPath: /config
                  readOnly: true
                - name: output
                  mountPath: /data
          volumes:
            - name: config
              configMap:
                name: {{ .Values.configMapName }}
            - name: output
              persistentVolumeClaim:
                claimName: {{ .Values.pvcName }}
