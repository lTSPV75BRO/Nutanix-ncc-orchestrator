apiVersion: batch/v1
kind: CronJob
metadata:
  name: ncc-orchestrator
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: ncc-orchestrator
spec:
  schedule: {{ .Values.cronjob.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: {{ .Values.cronjob.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.cronjob.failedJobsHistoryLimit }}
  startingDeadlineSeconds: {{ .Values.cronjob.startingDeadlineSeconds }}
  jobTemplate:
    spec:
      backoffLimit: {{ .Values.cronjob.backoffLimit }}
      activeDeadlineSeconds: 7200
      ttlSecondsAfterFinished: {{ .Values.cronjob.ttlSecondsAfterFinished }}
      template:
        metadata:
          labels:
            app: ncc-orchestrator
            component: runner
        spec:
          serviceAccountName: ncc-v2-runner
          automountServiceAccountToken: false
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            - name: seed-config
              image: {{ .Values.initImage }}
              command: ["sh", "-c", "mkdir -p /data/config && test -f /data/config/config.yaml || cp /config-cm/config.yaml /data/config/config.yaml"]
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: {{ .Values.readOnlyRootFilesystem }}
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - { name: config-cm, mountPath: /config-cm, readOnly: true }
                - { name: output, mountPath: /data }
          containers:
            - name: ncc-orchestrator
              image: "{{ .Values.images.runner.repository }}:{{ .Values.images.runner.tag }}"
              imagePullPolicy: {{ .Values.images.runner.pullPolicy }}
              resources: {{ .Values.resources.runner | toYaml | nindent 16 }}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: {{ .Values.readOnlyRootFilesystem }}
                capabilities:
                  drop: ["ALL"]
              # The image's WORKDIR (/workspace) is not writable by uid 1000, and
              # a relative logging.file or storage path in the config resolves
              # against it ("mkdir logs: permission denied"). Run from the PVC and
              # pass the same explicit paths as k8s/runner-cronjob.yaml.
              workingDir: /data
              args:
                - "--config"
                - "/data/config/config.yaml"
                - "--log-file"
                - "/data/logs/ncc-runner.log"
                - "--output-dir-filtered"
                - "/data/outputfiles"
                - "--output-dir-logs"
                - "/data/nccfiles"
                - "--run-history=true"
                - "--run-history-dir"
                - "/data/outputfiles/runs"
                - "--skip-preflight-check"
              env:
                - name: NCC_RUNTIME_MODE
                  value: kubernetes
                - name: NCC_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.secretName }}
                      key: password
              volumeMounts:
                - name: output
                  mountPath: /data
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir: {}
            - name: config-cm
              configMap:
                name: {{ .Values.configMapName }}
            - name: output
              persistentVolumeClaim:
                claimName: {{ .Values.pvcName }}
