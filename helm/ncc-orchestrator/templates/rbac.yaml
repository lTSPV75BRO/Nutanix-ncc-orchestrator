apiVersion: v1
kind: ServiceAccount
metadata:
  name: ncc-v2-api
  namespace: {{ .Values.namespace }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ncc-v2-runner
  namespace: {{ .Values.namespace }}
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ncc-v2-api
  namespace: {{ .Values.namespace }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["ncc-v2-users"]
    verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ncc-v2-api
  namespace: {{ .Values.namespace }}
subjects:
  - kind: ServiceAccount
    name: ncc-v2-api
roleRef:
  kind: Role
  name: ncc-v2-api
  apiGroup: rbac.authorization.k8s.io
