# NCC Orchestrator canonical configuration, schema version 1.
#
# This file is deployment-neutral and is consumed by the runner. Existing
# flat keys remain supported for compatibility, but new configurations should
# use this structure. Secrets must use secret:// references or environment
# variables; never commit plaintext credentials.
#
# Validate:
#   ncc-orchestrator validate-config --config example_config.yaml
#   ncc-orchestrator validate-secrets --config example_config.yaml

schema-version: 1

runner:
  targets:
    mode: clusters                  # clusters | clusters-file | pcs | pcs-file
    clusters: ["10.2.XX.XX"]        # PE IPs/FQDNs
    clusters-file: ""
    pcs: []                          # Prism Central IPs/FQDNs
    pcs-file: ""
    prism-central-url: ""
    discover-api-version: v4
  credentials:
    username: admin
    password: secret://NCC_PASSWORD
  connection:
    insecure-skip-verify: false
    ca-bundle: ""
    pin-sha256: []
    ncc-api-version: v4
    nutanix-v4-api-version: v4.2
  execution:
    timeout: 15m
    request-timeout: 20s
    poll-interval: 15s
    poll-jitter: 2s
    max-parallel: 4
    adaptive-parallelism: true
    dry-run: false
  outputs:
    formats: [html, csv]
    single-report: false
  filtering:
    severity: []
    exclude-alert-titles: []
    exclude-alert-titles-file: ""
    exclude-alert-match-mode: exact
  history:
    enabled: true
    retain-last: 500
    retain-days: 30
    artifact-retain-days: 0
    artifact-retain-max-files: 0
  policy:
    gates: ""
    notify-on-regression: false
    flaky-lookback-runs: 6
    flaky-min-transitions: 2
  retry:
    max-attempts: 6
    base-delay: 400ms
    max-delay: 8s
    circuit-breaker: 3
  http-pool:
    max-idle-conns: 0
    max-idle-conns-per-host: 0
    max-conns-per-host: 0
    idle-conn-timeout: 90s

storage:
  output-dir: outputfiles
  logs-dir: nccfiles
  run-history-dir: outputfiles/runs
  prom-dir: outputfiles/prom
  notification-deadletter-dir: ""

logging:
  file: logs/ncc-runner.log
  level: "2"
  http: false

prometheus:
  enabled: false

notifications:
  quiet-hours: ""
  maintenance-windows: []
  email:
    enabled: false
    attach-html: false
    digest: false
    smtp-server: smtp.example.com
    smtp-port: 587
    smtp-user: ncc@example.com
    smtp-password: secret://SMTP_PASSWORD
    from: ncc@example.com
    to: [ops@example.com]
    use-tls: true
    insecure-skip-verify: false
    subject-template: ""
    body-template: ""
  webhook:
    enabled: false
    include-html: false
    url: https://hooks.example.com/ncc
    headers: {}
    template: ""
    secret: secret://WEBHOOK_HMAC
  slack:
    enabled: false
    webhook-url: secret://SLACK_WEBHOOK_URL
    channel: ""

api:
  listen: ":8081"
  auth-mode: hybrid
  cache:
    pc-alerts-cache-ttl: 5m
  session:
    ttl: 6h
  concurrency:
    max-runs: 1
  tls:
    enabled: false
    cert-file: ""
    key-file: ""
  self-heal:
    enabled: true
    interval: 0s
    auto-fix: false

ui:
  listen: ":8080"
  backend-url: http://localhost:8081
  origin: http://localhost:8080
  insecure-http: false

deployment:
  platform: host                 # host | kubernetes
  self-heal: true
  schedule-authority: native     # native | kubernetes

secrets:
  provider: env                  # env | file
  file: ""
