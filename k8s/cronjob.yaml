# Runs NCC checks every 4 hours. Writes index.html and reports to the shared PVC.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ncc-orchestrator
  namespace: ncc-orchestrator
  labels:
    app.kubernetes.io/name: ncc-orchestrator
spec:
  schedule: "0 */4 * * *"   # Every 4 hours at minute 0
  concurrencyPolicy: Forbid  # Skip next run if previous is still running
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      ttlSecondsAfterFinished: 86400   # Keep Job (and pods) 24h after finish so you can get logs from failed runs
      template:
        metadata:
          labels:
            app: ncc-orchestrator
            component: runner
        spec:
          restartPolicy: OnFailure
          # No fsGroup: NFS root_squash maps root to anon user; fsGroup can conflict and cause permission denied
          initContainers:
            - name: create-dirs
              image: busybox:1.36
              # Create dirs; remove log, aggregated index, per-cluster HTML/CSV/JSON and .prom so we can create them fresh (avoids NFS ownership issues). Keep *.log in outputfiles for replay.
              command: ["sh", "-c", "mkdir -p /data/logs /data/nccfiles /data/outputfiles /data/promfiles && rm -f /data/logs/ncc-runner.log /data/outputfiles/index.html /data/outputfiles/*.log.html /data/outputfiles/*.log.csv /data/outputfiles/*.log.json /data/promfiles/*.prom && chmod -R 777 /data 2>/dev/null || true"]
              volumeMounts:
                - name: output
                  mountPath: /data
          containers:
            - name: ncc-orchestrator
              image: docker.io/prajwalnutant/nutanix-ncc-orchestrator:0.1.12
              imagePullPolicy: IfNotPresent
              # Run as root so NFS root_squash maps us to same anon user as init; then we can create/rotate log and write outputs
              args:
                - "--config"
                - "/config/config.yaml"
              env:
                - name: NCC_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: ncc-orchestrator-credentials
                      key: password
              volumeMounts:
                - name: config
                  mountPath: /config
                  readOnly: true
                - name: output
                  mountPath: /data
          volumes:
            - name: config
              configMap:
                name: ncc-orchestrator-config
            - name: output
              persistentVolumeClaim:
                claimName: ncc-orchestrator-output
