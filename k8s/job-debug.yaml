# One-off job to capture logs when the CronJob fails.
# Usage:
#   kubectl apply -f k8s/job-debug.yaml -n ncc-orchestrator
#   kubectl logs -n ncc-orchestrator -f job/ncc-debug --all-containers=true
# Then delete: kubectl delete job ncc-debug -n ncc-orchestrator
apiVersion: batch/v1
kind: Job
metadata:
  name: ncc-debug
  namespace: ncc-orchestrator
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app: ncc-orchestrator
        component: runner
    spec:
      restartPolicy: Never
      # No fsGroup: NFS root_squash maps root to anon user; fsGroup can conflict and cause permission denied
      initContainers:
        - name: create-dirs
          image: busybox:1.36
          # Create dirs, remove log and aggregated output so we can create them fresh (avoids NFS ownership issues)
          command: ["sh", "-c", "mkdir -p /data/logs /data/nccfiles /data/outputfiles /data/promfiles && rm -f /data/logs/ncc-runner.log /data/outputfiles/index.html && chmod -R 777 /data 2>/dev/null || true"]
          volumeMounts:
            - name: output
              mountPath: /data
      containers:
        - name: ncc-orchestrator
          image: docker.io/prajwalnutant/nutanix-ncc-orchestrator:0.1.12
          imagePullPolicy: Always
          # Run as root so NFS root_squash maps us to same anon user as init; then we can create/rotate log and write outputs
          args:
            - "--config"
            - "/config/config.yaml"
            - "--replay"
          env:
            - name: NCC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ncc-orchestrator-credentials
                  key: password
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: output
              mountPath: /data
      volumes:
        - name: config
          configMap:
            name: ncc-orchestrator-config
        - name: output
          persistentVolumeClaim:
            claimName: ncc-orchestrator-output
