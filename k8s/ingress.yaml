apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ncc-v2-ui
  namespace: ncc-orchestrator-v2
  annotations:
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "32m"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - ncc.example.com
      secretName: ncc-v2-ui-tls
  rules:
    - host: ncc.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ncc-v2-ui
                port:
                  name: http
