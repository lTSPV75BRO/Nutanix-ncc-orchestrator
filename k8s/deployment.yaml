# Serves the NCC reports (index.html and other HTML/CSV) from the shared PVC.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ncc-orchestrator-web
  namespace: ncc-orchestrator
  labels:
    app.kubernetes.io/name: ncc-orchestrator
    component: webserver
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ncc-orchestrator
      component: webserver
  template:
    metadata:
      labels:
        app: ncc-orchestrator
        component: webserver
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: outputfiles
              mountPath: /usr/share/nginx/html
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
          resources:
            requests:
              memory: "32Mi"
              cpu: "10m"
            limits:
              memory: "64Mi"
              cpu: "100m"
      volumes:
        - name: outputfiles
          persistentVolumeClaim:
            claimName: ncc-orchestrator-output
        - name: nginx-config
          configMap:
            name: ncc-orchestrator-nginx-config
