# Canonical Kubernetes entrypoint.
# Usage: kubectl apply -k k8s/
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - configmap.yaml
  - secret.yaml
  - pvc.yaml
  - runner-cronjob.yaml
  - api-deployment.yaml
  - api-service.yaml
  - ui-deployment.yaml
  - ui-service.yaml
  - networkpolicy-default-deny-ingress.yaml
  - networkpolicy-ui-ingress.yaml
  - networkpolicy-api-ingress.yaml
