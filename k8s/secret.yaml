# Prism password for NCC. Create from literal or from file:
#   kubectl create secret generic ncc-orchestrator-credentials -n ncc-orchestrator --from-literal=password=YOUR_PRISM_PASSWORD
# Or apply this and replace the base64 value (echo -n 'yourpassword' | base64).
apiVersion: v1
kind: Secret
metadata:
  name: ncc-orchestrator-credentials
  namespace: ncc-orchestrator
  labels:
    app.kubernetes.io/name: ncc-orchestrator
type: Opaque
stringData:
  # Used as env NCC_PASSWORD in the CronJob (replace before applying)
  password: "REPLACE_WITH_PRISM_PASSWORD"
