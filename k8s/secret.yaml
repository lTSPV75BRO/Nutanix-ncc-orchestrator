apiVersion: v1
kind: Secret
metadata:
  name: ncc-v2-secrets
  namespace: ncc-orchestrator-v2
type: Opaque
# Deliberately empty: provision credentials out-of-band. jwt-secret is required
# so API replicas share the same HS256 key for session JWTs. backup-key (seals
# API-created backups; required unless NCC_BACKUP_ENCRYPTION=optional or a
# passphrase is entered per backup) and master-key (envelope-encrypts the user
# store) are optional but recommended. Store a copy of backup-key outside the
# cluster: encrypted backups cannot be restored without it. For example:
# kubectl -n ncc-orchestrator-v2 create secret generic ncc-v2-secrets \
#   --from-literal=prism-password='...' \
#   --from-literal=api-token='...' \
#   --from-literal=jwt-secret="$(openssl rand -base64 32)" \
#   --from-literal=backup-key="$(openssl rand -base64 32)" \
#   --from-literal=master-key="$(openssl rand -base64 32)" \
#   --dry-run=client -o yaml | kubectl apply -f -
data: {}
