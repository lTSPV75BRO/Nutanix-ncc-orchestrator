apiVersion: v1
kind: Secret
metadata:
  name: ncc-v2-secrets
  namespace: ncc-orchestrator-v2
type: Opaque
stringData:
  # Prism password injected as NCC_PASSWORD for runner/api-triggered runs.
  prism-password: "REPLACE_WITH_PRISM_PASSWORD"
  # API auth token for ncc-api-server token mode.
  api-token: "REPLACE_WITH_STRONG_API_TOKEN"
