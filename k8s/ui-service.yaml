apiVersion: v1
kind: Service
metadata:
  name: ncc-v2-ui
  namespace: ncc-orchestrator-v2
  annotations:
    metallb.io/address-pool: "metallb"
spec:
  type: LoadBalancer
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
  selector:
    app: ncc-orchestrator-v2
    component: ui
