apiVersion: apps/v1
kind: Deployment
metadata:
  name: ncc-v2-api
  namespace: ncc-orchestrator-v2
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ncc-orchestrator-v2
      component: api
  template:
    metadata:
      labels:
        app: ncc-orchestrator-v2
        component: api
    spec:
      serviceAccountName: ncc-v2-api
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: ncc-orchestrator-v2
              component: api
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: "OnRootMismatch"
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: stage-orchestrator-binary
          image: docker.io/prajwalnutant/nutanix-ncc-orchestrator:2.2.0
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "cp /usr/local/bin/ncc-orchestrator /tools/ncc-orchestrator && chmod 0755 /tools/ncc-orchestrator"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tools
              mountPath: /tools

        # Seeds the PVC-backed canonical config without overwriting UI edits.
        - name: stage-config
          image: busybox:1.36
          command: ["sh", "-c", "mkdir -p /data/config && test -f /data/config/config.yaml || cp /config-cm/config.yaml /data/config/config.yaml"]
          volumeMounts:
            - name: config-cm-vol
              mountPath: /config-cm
            - name: data
              mountPath: /data

      containers:
        - name: api
          image: docker.io/prajwalnutant/ncc-api-server:2.2.0
          imagePullPolicy: IfNotPresent
          args:
            - "--listen"
            - ":8081"
            - "--repo-root"
            - "/data"
            - "--config-path"
            - "/data/config/config.yaml"
            - "--output-dir"
            - "/data/outputfiles"
            - "--log-dir"
            - "/data/nccfiles"
            - "--runner-log-path"
            - "/data/logs/ncc-runner.log"
            - "--orchestrator-bin"
            - "/tools/ncc-orchestrator"
            - "--audit-log-path"
            - "/data/logs/ncc-audit.log"
            - "--notifications-state-path"
            - "/data/logs/.ncc-api-notifications.json"
            - "--token-file-path"
            - "/data/auth/.ncc-api-token"
            - "--users-db"
            - ""
            - "--users-db-secret"
            - "ncc-v2-users"
            - "--auth-mode"
            - "token"
            - "--cors-origin"
            - "$(NCC_UI_ORIGIN)"
          env:
            - name: NCC_RUNTIME_MODE
              value: "kubernetes"
            - name: NCC_UI_ORIGIN
              valueFrom:
                configMapKeyRef:
                  name: ncc-v2-config
                  key: ui-origin
            - name: NCC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ncc-v2-secrets
                  key: prism-password
            - name: NCC_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ncc-v2-secrets
                  key: api-token
          ports:
            - containerPort: 8081
              name: http
          startupProbe:
            httpGet:
              path: /api/v1/health
              port: 8081
            periodSeconds: 5
            failureThreshold: 12
            timeoutSeconds: 2
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8081
            initialDelaySeconds: 3
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 20
            failureThreshold: 3
            timeoutSeconds: 2
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tools
              mountPath: /tools
              readOnly: true
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
      volumes:
        - name: config-cm-vol
          configMap:
            name: ncc-v2-config
        - name: data
          persistentVolumeClaim:
            claimName: ncc-v2-data
        - name: tools
          emptyDir: {}
