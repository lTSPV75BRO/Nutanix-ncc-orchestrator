apiVersion: apps/v1
kind: Deployment
metadata:
  name: ncc-v2-api
  namespace: ncc-orchestrator-v2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ncc-orchestrator-v2
      component: api
  template:
    metadata:
      labels:
        app: ncc-orchestrator-v2
        component: api
    spec:
      serviceAccountName: ncc-v2-api
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: ncc-orchestrator-v2
              component: api
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: "OnRootMismatch"
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: stage-orchestrator-binary
          image: docker.io/prajwalnutant/nutanix-ncc-orchestrator:2.3.0
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "cp /usr/local/bin/ncc-orchestrator /tools/ncc-orchestrator && chmod 0755 /tools/ncc-orchestrator"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tools
              mountPath: /tools

        # Seeds the PVC-backed canonical config without overwriting UI edits.
        - name: stage-config
          image: busybox:1.37
          command: ["sh", "-c", "mkdir -p /data/config && test -f /data/config/config.yaml || cp /config-cm/config.yaml /data/config/config.yaml"]
          volumeMounts:
            - name: config-cm-vol
              mountPath: /config-cm
            - name: data
              mountPath: /data

      containers:
        - name: api
          image: docker.io/prajwalnutant/ncc-api-server:2.3.0
          imagePullPolicy: IfNotPresent
          args:
            - "--listen"
            - ":8081"
            - "--repo-root"
            - "/data"
            - "--config-path"
            - "/data/config/config.yaml"
            - "--output-dir"
            - "/data/outputfiles"
            - "--log-dir"
            - "/data/nccfiles"
            - "--runner-log-path"
            - "/data/logs/ncc-runner.log"
            - "--orchestrator-bin"
            - "/tools/ncc-orchestrator"
            - "--audit-log-path"
            - "/data/logs/ncc-audit.log"
            - "--notifications-state-path"
            - "/data/logs/.ncc-api-notifications.json"
            - "--token-file-path"
            - "/data/auth/.ncc-api-token"
            - "--users-db"
            - ""
            - "--users-db-secret"
            - "ncc-v2-users"
            - "--auth-mode"
            - "token"
            - "--cookie-secure"
            - "--cors-origin"
            - "$(NCC_UI_ORIGIN)"
          env:
            - name: NCC_RUNTIME_MODE
              value: "kubernetes"
            # Soft heap limit for the Go runtime, ~90% of the memory limit.
            - name: GOMEMLIMIT
              value: "1800MiB"
            - name: NCC_IMAGE_TAG
              value: "2.3.0"
            - name: NCC_ORCHESTRATOR_IMAGE_TAG
              value: "2.3.0"
            - name: NCC_UI_IMAGE_TAG
              value: "2.3.0"
            - name: NCC_UI_ORIGIN
              valueFrom:
                configMapKeyRef:
                  name: ncc-v2-config
                  key: ui-origin
            - name: NCC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ncc-v2-secrets
                  key: prism-password
            - name: NCC_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ncc-v2-secrets
                  key: api-token
            - name: NCC_API_STATIC_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ncc-v2-secrets
                  key: api-token
            - name: NCC_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: ncc-v2-secrets
                  key: jwt-secret
            # Server-side key that seals API-created backups (AES-256-GCM).
            # Backups are encrypted by default (NCC_BACKUP_ENCRYPTION=required);
            # without this key, snapshots need a per-request passphrase.
            # Create with: --from-literal=backup-key="$(openssl rand -base64 32)"
            - name: NCC_BACKUP_KEY
              valueFrom:
                secretKeyRef:
                  name: ncc-v2-secrets
                  key: backup-key
                  optional: true
            # Optional application-level envelope encryption of the user store
            # (in addition to etcd encryption of the ncc-v2-users Secret).
            - name: NCC_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: ncc-v2-secrets
                  key: master-key
                  optional: true
            # Trust X-Forwarded-For only from these peers (the UI pods / ingress).
            # Narrow this to your pod CIDR for accurate per-client rate limits.
            - name: NCC_TRUSTED_PROXY_CIDRS
              value: "private,loopback"
          ports:
            - containerPort: 8081
              name: http
          startupProbe:
            httpGet:
              path: /api/v1/health
              port: 8081
            periodSeconds: 5
            failureThreshold: 12
            timeoutSeconds: 2
          readinessProbe:
            # Checks the user store, runner binary and output volume; liveness
            # stays on /api/v1/health so a dependency problem removes the pod
            # from the Service instead of restart-looping it.
            httpGet:
              path: /api/v1/health/ready
              port: 8081
            initialDelaySeconds: 3
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 20
            failureThreshold: 3
            timeoutSeconds: 2
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tools
              mountPath: /tools
              readOnly: true
          # Sizing: the api-server keeps the latest report and alert history
          # parsed in memory. Measured at 7,000 clusters / 200k findings it
          # used ~1 GiB; small fleets use well under 256Mi. GOMEMLIMIT (env
          # above) keeps the Go heap under the limit instead of OOM-killing.
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "2Gi"
      volumes:
        - name: config-cm-vol
          configMap:
            name: ncc-v2-config
        - name: data
          persistentVolumeClaim:
            claimName: ncc-v2-data
        - name: tools
          emptyDir: {}
