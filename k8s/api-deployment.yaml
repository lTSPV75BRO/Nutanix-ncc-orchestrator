apiVersion: apps/v1
kind: Deployment
metadata:
  name: ncc-v2-api
  namespace: ncc-orchestrator-v2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ncc-orchestrator-v2
      component: api
  template:
    metadata:
      labels:
        app: ncc-orchestrator-v2
        component: api
    spec:
      # Dedicated service account whose RBAC (see rbac.yaml) lets the
      # api-server read/create/patch ONLY the ncc-v2-users Secret that backs
      # the user database. The Secret is encrypted at rest by etcd when the
      # cluster has an EncryptionConfiguration (see encryption-config.example.yaml).
      serviceAccountName: ncc-v2-api
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: "OnRootMismatch"
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: stage-orchestrator-binary
          # Pull ncc-orchestrator from the runner image and share it with API container.
          image: docker.io/prajwalnutant/nutanix-ncc-orchestrator:2.1.1
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "cp /usr/local/bin/ncc-orchestrator /tools/ncc-orchestrator && chmod 0755 /tools/ncc-orchestrator"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tools
              mountPath: /tools
      containers:
        - name: api
          # Replace with your v2 api image that contains ncc-api-server.
          image: docker.io/prajwalnutant/ncc-api-server:2.1.1
          imagePullPolicy: IfNotPresent
          args:
            - "--listen"
            - ":8081"
            - "--repo-root"
            - "/"
            - "--config-path"
            - "/config/config.yaml"
            - "--output-dir"
            - "/data/outputfiles"
            - "--log-dir"
            - "/data/nccfiles"
            - "--runner-log-path"
            - "/data/logs/ncc-runner.log"
            - "--orchestrator-bin"
            - "/tools/ncc-orchestrator"
            - "--token-file-path"
            - "/data/auth/.ncc-api-token"
            # User database stored in a Kubernetes Secret (encrypted at rest by
            # etcd) instead of a file on the PVC. On first launch the api-server
            # provisions an `admin` account with a random password and writes it
            # to the same Secret under `initial-admin-password`. Retrieve it via:
            #   kubectl -n ncc-orchestrator-v2 get secret ncc-v2-users \
            #     -o jsonpath='{.data.initial-admin-password}' | base64 -d
            # (also printed to `kubectl logs deploy/ncc-v2-api`). You must change
            # it on first login; auth-mode auto-upgrades to hybrid so the
            # NCC_API_TOKEN automation path keeps working.
            - "--users-db-secret"
            - "ncc-v2-users"
            - "--auth-mode"
            - "token"
            - "--cors-origin"
            - "http://localhost:8080"
          env:
            - name: NCC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ncc-v2-secrets
                  key: prism-password
            - name: NCC_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ncc-v2-secrets
                  key: api-token
          ports:
            - containerPort: 8081
              name: http
          startupProbe:
            httpGet:
              path: /api/v1/health
              port: 8081
            periodSeconds: 5
            failureThreshold: 12
            timeoutSeconds: 2
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8081
            initialDelaySeconds: 3
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 20
            failureThreshold: 3
            timeoutSeconds: 2
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: data
              mountPath: /data
            - name: tools
              mountPath: /tools
              readOnly: true
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
      volumes:
        - name: config
          configMap:
            name: ncc-v2-config
        - name: data
          persistentVolumeClaim:
            claimName: ncc-v2-data
        - name: tools
          emptyDir: {}
