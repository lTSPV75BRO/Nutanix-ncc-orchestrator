apiVersion: batch/v1
kind: CronJob
metadata:
  name: ncc-v2-runner
  namespace: ncc-orchestrator-v2
spec:
  schedule: "15 */4 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  startingDeadlineSeconds: 900
  jobTemplate:
    spec:
      backoffLimit: 1
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app: ncc-orchestrator-v2
            component: runner
        spec:
          serviceAccountName: ncc-v2-runner
          restartPolicy: OnFailure
          securityContext:
            fsGroup: 1000
            fsGroupChangePolicy: "OnRootMismatch"
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            - name: seed-config
              image: busybox:1.36
              command: ["sh", "-c", "mkdir -p /data/config && test -f /data/config/config.yaml || cp /config-cm/config.yaml /data/config/config.yaml"]
              securityContext:
                runAsNonRoot: true
                runAsUser: 1000
                runAsGroup: 1000
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: config-cm
                  mountPath: /config-cm
                  readOnly: true
                - name: data
                  mountPath: /data
          containers:
            - name: ncc-orchestrator
              image: docker.io/prajwalnutant/nutanix-ncc-orchestrator:2.2.0
              imagePullPolicy: IfNotPresent
              securityContext:
                runAsNonRoot: true
                runAsUser: 1000
                runAsGroup: 1000
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              args:
                - "--config"
                - "/data/config/config.yaml"
              env:
                - name: NCC_RUNTIME_MODE
                  value: "kubernetes"
                - name: NCC_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: ncc-v2-secrets
                      key: prism-password
              volumeMounts:
                - name: data
                  mountPath: /data
          volumes:
            - name: config-cm
              configMap:
                name: ncc-v2-config
            - name: data
              persistentVolumeClaim:
                claimName: ncc-v2-data
