apiVersion: batch/v1
kind: CronJob
metadata:
  name: ncc-v2-runner
  namespace: ncc-orchestrator-v2
spec:
  schedule: "15 */4 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app: ncc-orchestrator-v2
            component: runner
        spec:
          restartPolicy: OnFailure
          securityContext:
            fsGroup: 1000
            fsGroupChangePolicy: "OnRootMismatch"
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            - name: create-dirs
              image: busybox:1.36
              command: ["sh", "-c", "mkdir -p /data/auth /data/logs /data/nccfiles /data/outputfiles /data/promfiles && chown -R 1000:1000 /data && chmod 0750 /data /data/auth /data/logs /data/nccfiles /data/outputfiles /data/promfiles 2>/dev/null || true"]
              securityContext:
                runAsUser: 0
                runAsGroup: 0
                runAsNonRoot: false
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: data
                  mountPath: /data
          containers:
            - name: ncc-orchestrator
              image: docker.io/prajwalnutant/nutanix-ncc-orchestrator:2.1.0
              imagePullPolicy: IfNotPresent
              securityContext:
                runAsNonRoot: true
                runAsUser: 1000
                runAsGroup: 1000
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              args:
                - "--config"
                - "/config/config.yaml"
              env:
                - name: NCC_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: ncc-v2-secrets
                      key: prism-password
              volumeMounts:
                - name: config
                  mountPath: /config
                  readOnly: true
                - name: data
                  mountPath: /data
          volumes:
            - name: config
              configMap:
                name: ncc-v2-config
            - name: data
              persistentVolumeClaim:
                claimName: ncc-v2-data
