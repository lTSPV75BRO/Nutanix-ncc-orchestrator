# Nginx config: serve from outputfiles subdirectory; show friendly message if no report yet.
apiVersion: v1
kind: ConfigMap
metadata:
  name: ncc-orchestrator-nginx-config
  namespace: ncc-orchestrator
  labels:
    app.kubernetes.io/name: ncc-orchestrator
data:
  default.conf: |
    server {
      listen 80;
      server_name _;
      root /usr/share/nginx/html/outputfiles;
      index index.html;
      location / {
        try_files $uri $uri/ =404;
      }
      # Optional: do not list directory contents
      autoindex off;
    }
