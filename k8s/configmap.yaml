# config.yaml for NCC orchestrator (clusters, options).
# Password: leave empty here and set via Secret + env NCC_PASSWORD (see secret.yaml and cronjob.yaml).
# Any option can be overridden by env NCC_<KEY> (e.g. NCC_CLUSTERS, NCC_LOG_LEVEL). Run with --env-info to list.
apiVersion: v1
kind: ConfigMap
metadata:
  name: ncc-orchestrator-config
  namespace: ncc-orchestrator
  labels:
    app.kubernetes.io/name: ncc-orchestrator
data:
  config.yaml: |
    # Cluster list (comma-separated IPs or hostnames); replace with your Prism IPs
    clusters: "10.48.XX.XX,10.48.XX.XX"
    username: "admin"
    password: ""
    ncc-api-version: v4         # v4 (default) or Legacy (Prism Gateway v1 start-checks); v1 is an alias for Legacy
    nutanix-v4-api-version: v4.2  # clustermgmt/monitoring path revision (v4.2 default; e.g. v4.0.a1)
    insecure-skip-verify: false   # Set true for lab/self-signed Prism certs
    timeout: "15m"
    request-timeout: "30s"    # Code default 20s; increase if needed for slow clusters
    poll-interval: "15s"
    poll-jitter: "2s"
    max-parallel: 4
    outputs: "html"
    # Paths inside the container; PVC is mounted at /data in the CronJob
    output-dir-logs: "/data/nccfiles"
    output-dir-filtered: "/data/outputfiles"
    log-file: "/data/logs/ncc-runner.log"
    log-level: "2"
    log-http: false
    retry-max-attempts: 6
    retry-base-delay: "400ms"
    retry-max-delay: "8s"
    prom-dir: "/data/promfiles"
    # Severity filter: comma-separated FAIL,WARN,ERR,INFO; empty = all
    severity-filter: ""
    # HTTP connection pool (optional)
    max-idle-conns: 100
    max-idle-conns-per-host: 10
    max-conns-per-host: 0
    idle-conn-timeout: "90s"
    # Email notifications (optional)
    email-enabled: false
    email-attach-html: false   # Attach per-cluster or digest HTML report to email
    notify-digest: false       # If true: one email/webhook/slack per run (overview + optional index.html) instead of per-cluster
    smtp-server: "smtp.example.com"
    smtp-port: 587
    smtp-user: "ncc@example.com"
    smtp-password: ""
    email-from: "ncc@example.com"
    email-to: "ops@example.com,sre@example.com"
    email-use-tls: true
    # Webhook notifications (optional)
    webhook-enabled: false
    webhook-include-html: false   # Include per-cluster HTML report as base64 in webhook JSON (overview always included)
    webhook-url: "https://hooks.example.com/ncc"
    webhook-headers:
      X-Auth-Token: "changeme"
    # Slack notifications (optional)
    slack-enabled: false
    slack-webhook-url: ""
    slack-channel: ""
