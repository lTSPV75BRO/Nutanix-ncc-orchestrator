#cloud-config
#
# Set NCC_VERSION and NCC_RELEASE_BASE_URL before applying this file.
# The generated service starts the v2 stack with HTTPS enabled by default.

package_update: true
packages:
  - curl
  - ca-certificates
  - tar

write_files:
  - path: /etc/ncc/ncc-install.env
    permissions: "0600"
    content: |
      NCC_VERSION="2.4.0"
      NCC_RELEASE_BASE_URL="https://github.com/lTSPV75BRO/Nutanix-ncc-orchestrator/releases/download"
      NCC_VERIFY_ATTESTATION="auto"
      NCC_INSTALL_DIR="/opt/ncc-v2"
      NCC_API_PORT="8081"
      NCC_UI_PORT="8080"
      NCC_CLUSTERS=""
      NCC_PCS=""
      NCC_USERNAME="admin"
      NCC_PASSWORD='CHANGE_ME'

  - path: /usr/local/sbin/install-ncc-v2
    permissions: "0750"
    owner: root:root
    content: |
      #!/bin/sh
      set -eu
      . /etc/ncc/ncc-install.env

      arch="$(uname -m)"
      case "$arch" in
        x86_64) arch="amd64" ;;
        aarch64|arm64) arch="arm64" ;;
        *) echo "Unsupported architecture: $arch" >&2; exit 1 ;;
      esac

      archive="ncc-v2-stack-linux-${arch}.tar.gz"
      tmp="$(mktemp -d)"
      trap 'rm -rf "$tmp"' EXIT

      # GitHub release tags start with "v" (v2.4.0). A mirror may use either
      # form, so try the tag first and the bare version next.
      version="${NCC_VERSION#v}"
      base=""
      for tag in "v$version" "$version"; do
        if curl --fail --location --silent --show-error \
          "${NCC_RELEASE_BASE_URL%/}/$tag/checksums.txt" -o "$tmp/checksums.txt"; then
          base="${NCC_RELEASE_BASE_URL%/}/$tag"
          break
        fi
      done
      [ -n "$base" ] || {
        echo "No release $NCC_VERSION found under $NCC_RELEASE_BASE_URL" >&2
        exit 1
      }
      curl --fail --location --silent --show-error \
        "$base/$archive" -o "$tmp/$archive"
      expected="$(awk -v name="$archive" '$2 == name { print $1; exit }' "$tmp/checksums.txt")"
      actual="$(sha256sum "$tmp/$archive" | awk '{print $1}')"
      [ -n "$expected" ] && [ "$expected" = "$actual" ] || {
        echo "Release checksum verification failed for $archive" >&2
        exit 1
      }

      # The checksum comes from the same place as the archive, so it only proves
      # the download is complete. The build attestation proves the archive came
      # from this project's release workflow. "auto" checks it when the GitHub
      # CLI is installed and signed in (or GH_TOKEN is set); "require" fails
      # without it; "off" skips it.
      attest="${NCC_VERIFY_ATTESTATION:-auto}"
      case "$attest" in auto|require|off) ;; *)
        echo "NCC_VERIFY_ATTESTATION must be auto, require or off" >&2; exit 1 ;;
      esac
      if [ "$attest" != "off" ]; then
        if command -v gh >/dev/null 2>&1 && gh auth status >/dev/null 2>&1; then
          gh attestation verify "$tmp/$archive" --repo "${NCC_RELEASE_REPO:-lTSPV75BRO/Nutanix-ncc-orchestrator}" || {
            echo "Build attestation verification failed for $archive. Set NCC_VERIFY_ATTESTATION=off only if you trust the source." >&2
            exit 1
          }
        elif [ "$attest" = "require" ]; then
          echo "NCC_VERIFY_ATTESTATION=require needs the GitHub CLI (gh), signed in or with GH_TOKEN set" >&2
          exit 1
        else
          echo "Build attestation not checked: the GitHub CLI is missing or not signed in." >&2
        fi
      fi

      # Never wipe an existing install: it holds the user database, API token,
      # backups and reports. To upgrade, stop the service and replace bin and
      # frontend-dist, or set NCC_FORCE_CLEAN=1 to delete everything on purpose.
      if [ -d "$NCC_INSTALL_DIR" ] && [ -n "$(ls -A "$NCC_INSTALL_DIR")" ]; then
        if [ "${NCC_FORCE_CLEAN:-0}" != "1" ]; then
          echo "$NCC_INSTALL_DIR already contains files. Refusing to delete user data and backups. Stop the service and replace bin and frontend-dist to upgrade, or set NCC_FORCE_CLEAN=1 to remove the directory." >&2
          exit 1
        fi
        rm -rf "$NCC_INSTALL_DIR"
      fi
      mkdir -p "$NCC_INSTALL_DIR"
      tar --no-same-owner -xzf "$tmp/$archive" -C "$NCC_INSTALL_DIR"
      bin="$NCC_INSTALL_DIR/bin/ncc-orchestrator"
      chmod 0755 "$NCC_INSTALL_DIR"/bin/*

      mkdir -p "$NCC_INSTALL_DIR/outputfiles" "$NCC_INSTALL_DIR/logs"
      # The service looks for its configuration here.
      config="$NCC_INSTALL_DIR/config.yaml"
      # The service, schedules and runs from a shell all read the password from
      # this file; an environment variable would reach only some of them.
      secrets="$NCC_INSTALL_DIR/secrets.json"
      password="$(printf '%s' "$NCC_PASSWORD" | sed -e 's/\\/\\\\/g' -e 's/"/\\"/g')"
      (umask 077; printf '{"NCC_PASSWORD": "%s"}\n' "$password" > "$secrets")
      cat > "$config" <<EOF
      schema-version: 1
      runner:
        targets:
          mode: clusters
          clusters: [${NCC_CLUSTERS}]
          pcs: [${NCC_PCS}]
        credentials:
          username: "${NCC_USERNAME}"
          password: "secret://NCC_PASSWORD"
        execution:
          timeout: "15m"
          request-timeout: "20s"
          max-parallel: 0  # 0 = auto (one per cluster, up to 500)
        retry:
          max-attempts: 6
          base-delay: "400ms"
          max-delay: "8s"
          circuit-breaker: 3
      storage:
        output-dir: "${NCC_INSTALL_DIR}/outputfiles"
        logs-dir: "${NCC_INSTALL_DIR}/logs"
        run-history-dir: "${NCC_INSTALL_DIR}/outputfiles/runs"
      api:
        cache:
          pc-alerts-cache-ttl: "5m"
      deployment:
        platform: host
        self-heal: true
      secrets-provider: file
      secrets-file: "${secrets}"
      EOF
      chmod 0600 "$config"

      if command -v ufw >/dev/null 2>&1; then
        ufw allow "$NCC_UI_PORT/tcp"
        ufw allow "$NCC_API_PORT/tcp"
      elif command -v firewall-cmd >/dev/null 2>&1; then
        firewall-cmd --permanent --add-port="$NCC_UI_PORT/tcp"
        firewall-cmd --permanent --add-port="$NCC_API_PORT/tcp"
        firewall-cmd --reload
      fi

      # Also installs the update helper and the log maintenance timer. The ports
      # are passed only when they are not the standard ones.
      set --
      [ "$NCC_API_PORT" = 8081 ] || set -- "$@" --api-listen ":$NCC_API_PORT"
      [ "$NCC_UI_PORT" = 8080 ] || set -- "$@" --ui-listen ":$NCC_UI_PORT"
      "$bin" v2-install-service --install-dir "$NCC_INSTALL_DIR" --orchestrator-bin "$bin" --now "$@"

      echo "NCC v${version} installed. Set the Prism password in $secrets and the clusters in $config before running checks."

runcmd:
  - [sh, -c, /usr/local/sbin/install-ncc-v2]
