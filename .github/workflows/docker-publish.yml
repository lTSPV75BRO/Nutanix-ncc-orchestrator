name: Docker build and push

on:
  push:
    branches: [main]
    paths:
      - "**.go"
      - "frontend/**"
      - "go.mod"
      - "go.sum"
      - "Dockerfile*"
      - "deploy/docker/**"
      - "binaryGO.txt"
      - "VERSION"
      - ".github/workflows/docker-publish.yml"
  release:
    types: [published]

env:
  NCC_DOCKER_REGISTRY: docker.io
  NCC_IMAGE_PREFIX: prajwalnutant

jobs:
  images:
    name: linux images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        env:
          STREAM: Release
          GIT_REVISION: ${{ github.sha }}
        run: |
          bash binaryGO.txt \
            --os linux --arch amd64 \
            --skip-tests --no-stacks \
            --docker --push --docker-arch amd64
