name: Docker build and push

on:
  push:
    branches: [main]
    paths:
      - "**.go"
      - "frontend/**"
      - "go.mod"
      - "go.sum"
      - "build/docker/Dockerfile*"
      - "deploy/docker/**"
      - "scripts/binaryGO.txt"
      - "VERSION"
      - ".github/workflows/docker-publish.yml"
  release:
    types: [published]

env:
  NCC_DOCKER_REGISTRY: docker.io
  NCC_IMAGE_PREFIX: prajwalnutant

jobs:
  images:
    name: linux images
    runs-on: ubuntu-latest
    # Images go to Docker Hub with repo secrets, not GHCR, so the job token
    # needs no packages:write.
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "26.12.1" # >= 26.12.1: Oct 21 2026 Node security release; runner toolcache may lag
          # No dependency cache in a publishing workflow: a cache written by a
          # less-privileged run could poison the pushed images.

      - name: Check Docker Hub credentials
        id: creds
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::DOCKERHUB_USERNAME / DOCKERHUB_TOKEN repo secrets are not set; skipping image push."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to Docker Hub
        if: steps.creds.outputs.ok == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        if: steps.creds.outputs.ok == 'true'
        env:
          STREAM: Release
          GIT_REVISION: ${{ github.sha }}
          NODE_COMPILE_CACHE: ${{ runner.temp }}/node-compile-cache
        run: |
          bash scripts/binaryGO.txt \
            --os linux --arch amd64 \
            --skip-tests --no-stacks \
            --docker --push --docker-arch amd64
