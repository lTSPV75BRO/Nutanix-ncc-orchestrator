name: Docker build and push

on:
  push:
    branches: [main]
    paths:
      - "**.go"
      - "frontend/**"
      - "go.mod"
      - "go.sum"
      - "Dockerfile*"
      - "VERSION"
      - ".github/workflows/docker-publish.yml"
  release:
    types: [published]

env:
  REGISTRY: docker.io
  IMAGE_PREFIX: prajwalnutant

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: nutanix-ncc-orchestrator
            dockerfile: Dockerfile
          - name: ncc-api-server
            dockerfile: Dockerfile.api
          - name: ncc-ui-server
            dockerfile: Dockerfile.ui

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            version="${{ github.event.release.tag_name }}"
            version="${version#v}"
          else
            version="$(tr -d '[:space:]' < VERSION)"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build runner binary
        if: matrix.name == 'nutanix-ncc-orchestrator'
        run: |
          mkdir -p dist
          GOOS=linux GOARCH=amd64 go build -trimpath -buildvcs=true \
            -ldflags "-w -s -X main.Version=${{ steps.version.outputs.version }} -X main.GitRevision=${GITHUB_SHA}" \
            -o dist/ncc-orchestrator-linux-amd64 .

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.name }}:${{ steps.version.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
