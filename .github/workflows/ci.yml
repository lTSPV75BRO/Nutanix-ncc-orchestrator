# Continuous-integration quality gates. Runs on every push to main and on all
# pull requests. Keeps the default branch releasable: Go build/vet/race tests,
# golangci-lint, govulncheck, frontend tests + npm audit, and a Trivy
# filesystem scan.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: build, vet & race tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true
      - name: go build
        run: go build ./...
      - name: go vet
        run: go vet ./...
      - name: gofmt check
        run: |
          unformatted=$(gofmt -l $(git ls-files '*.go'))
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"; echo "$unformatted"; exit 1
          fi
      - name: go test -race
        run: go test -race -count=1 ./...

  test-windows:
    # Windows is a supported install target (zip stack, Task Scheduler
    # service), but CI only ran on Linux, so Windows-only defects shipped
    # unnoticed: process liveness always reported "dead" (restore over a
    # running stack, duplicate supervisors, scheduled runs hidden from Active
    # Runs) and the golden-report tests broke on CRLF checkouts.
    name: build & tests (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -count=1 ./...

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true
      - name: golangci-lint
        # v6 + "latest" was resolving to a stale cached v1.64.8 binary (built
        # with go1.24), which can't analyze a go.mod targeting a newer Go
        # toolchain (golangci-lint doesn't support forward Go versions). v9
        # pinned to a current v2.x release actually supports the toolchain
        # this project targets. v2.13.x cannot read Go 1.27 export data
        # ("export data version 5 is greater than maximum supported version
        # 4"); v2.15.0 is the first verified to type-check this module.
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          args: --timeout=5m

  frontend:
    name: frontend tests, audit & build
    runs-on: ubuntu-latest
    # NODE_COMPILE_CACHE lives on the steps, not here: the `runner` context is
    # not available in jobs.<id>.env, and referencing it there makes GitHub
    # reject the whole workflow (every push showed a 0-job "ci.yml" failure).
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26.12.1" # >= 26.12.1: Oct 21 2026 Node security release; runner toolcache may lag
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: npm ci
        env:
          NODE_COMPILE_CACHE: ${{ runner.temp }}/node-compile-cache
        run: npm ci
      - name: npm audit (production)
        run: npm audit --omit=dev
      - name: npm audit (dev tooling, high+)
        # Build/test tooling (vite, vitest, undici via jsdom) runs on developer
        # machines and CI runners, so high/critical advisories there block too
        # (vulnerability SLA in docs/compliance/RISK_REGISTER.md). Moderate
        # and low ones are reported below without blocking.
        run: npm audit --audit-level=high
      - name: npm audit (all, advisory)
        continue-on-error: true
        run: npm audit
      - name: npm test
        run: npm test
      - name: npm run build
        env:
          NODE_COMPILE_CACHE: ${{ runner.temp }}/node-compile-cache
        run: npm run build

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true
      - name: install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: run govulncheck
        run: govulncheck ./...

  trivy:
    name: trivy filesystem scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Trivy vulnerability + config scan
        # Pinned to the v0.35.0 commit SHA rather than a floating tag: in
        # March 2026 an attacker force-pushed malicious code onto 75 of 76
        # existing trivy-action version tags (a supply-chain compromise);
        # v0.35.0 was the sole tag left untouched. Pinning by SHA means this
        # reference can't be silently repointed by any future tag rewrite.
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
