name: "CodeQL"

on:
  push:
    branches: ["main", "v1.1.0", "v2.0.0"]
  pull_request:
    branches: ["main", "v1.1.0", "v2.0.0"]
  schedule:
    - cron: "29 2 * * 1"

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        # The repo has no first-party JS/TS at the analysis root (the React
        # frontend lives under `frontend/` and is built via vite; CodeQL's
        # JS/TS autodetect on the repo root fails). Scope the matrix to the
        # languages actually present at the top level.
        language: ["go", "actions"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          config-file: ./.github/codeql/codeql-config.yml

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
