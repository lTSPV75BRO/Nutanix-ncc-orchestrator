name: Release

# Tag-driven release pipeline. Pushing a `v*` tag (e.g. v2.4.0) builds
# every binary + every stack archive via scripts/binaryGO.txt, generates SBOMs
# and a release-attestation.json, signs checksums.txt with an Ed25519 release
# key, signs Linux artifacts with GPG, attests every published file with GitHub
# Actions SLSA provenance, and publishes the result as a GitHub Release.
#
# Three jobs, so that each holds only the privileges it needs:
#
#   preflight  contents:read   refuses a tag whose release is already public
#   build      contents:read   signing secrets + OIDC; builds, signs, attests,
#                              hands the files to `publish` as one artifact
#   publish    contents:write  no secrets, no build; creates a DRAFT release,
#                              uploads, verifies the uploaded files, then
#                              publishes. A failed run never leaves a visible
#                              half release (a published one is turned back
#                              into a draft).
#
# Why the release is created with `gh release create --verify-tag` and never
# updated with a target commit: the release v2.3.0 failed with "Resource not
# accessible by integration" because the update sent the release's old
# target_commitish, and the commits between that and the tag changed
# .github/workflows/*, which GITHUB_TOKEN may not do. Here the release always
# points at the existing tag and no request carries a target commit.
#
# What this gives release consumers:
#
#   1. SHA-256 manifest (checksums.txt), signed (checksums.txt.sig), and
#      attested like every other file, so `gh attestation verify` covers every
#      published file (scripts/verify-published-release.sh runs it for all).
#
#   2. CycloneDX 1.5 SBOMs (bom-*.cdx.json) for each binary; pluggable
#      into Trivy / Grype / Dependency-Track for CVE alerts.
#
#   3. release-attestation.json — a hand-rolled provenance document
#      that pairs with the SLSA attestation but is also human-readable
#      and tool-friendly without `gh` (good for air-gapped IT review).
#
# All steps run on stock GitHub-hosted runners. No self-hosted runner
# is involved at any point in the pipeline; that's a deliberate
# constraint so the SLSA attestation chain remains auditable end-to-end
# from a public, reproducible build environment.
#
# workflow_dispatch builds and attests but never creates a release.
#
# Release candidates: a tag with a suffix (v2.4.0-rc.1) is published as a
# pre-release and is never marked "Latest", so stable installs are not offered
# it. The tag must equal "v" plus the VERSION file (scripts/release-tag-check.sh).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag or commit to build"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Refuse an already-published tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout (scripts only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.ref }}
          persist-credentials: false

      - name: Check that the tag matches the VERSION file
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
        run: bash scripts/release-tag-check.sh "$TAG"

      - name: Check that the release for this tag is not public yet
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          state="$(bash scripts/release-state.sh "$TAG")"
          case "$state" in
            published)
              echo "::error title=Release $TAG already exists::A published release for $TAG already exists. This workflow will not modify it (its files would not be attested). Delete the release in the GitHub UI, or release a new tag."
              exit 1 ;;
            draft) echo "::notice::A draft release for $TAG exists (leftover of a failed run); it will be replaced." ;;
          esac

  build:
    name: Build, SBOM, sign, attest
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: release
    permissions:
      contents: read          # checkout only; nothing here can write the release
      id-token: write         # OIDC token for actions/attest-build-provenance
      attestations: write     # write the attestation back to the repo
    steps:
      - name: Checkout (tag or input ref)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
          # Full history is required so binaryGO.txt's git rev / dirty
          # detection matches what the developer would see locally.
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          check-latest: true
          cache: false

      - name: Setup Node (for frontend build)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "26.12.1" # >= 26.12.1: Oct 21 2026 Node security release; runner toolcache may lag
          # No dependency cache here: this job holds an OIDC token and signing
          # keys, so restoring a cache another run wrote is a poisoning path
          # into signed release artifacts.
          package-manager-cache: false

      - name: Install cyclonedx-gomod (SBOM generator)
        # Pinned version: bumping requires updating binaryGO.txt's
        # install hint comment too. cyclonedx-gomod is the canonical
        # CycloneDX SBOM tool maintained by the CycloneDX project.
        run: |
          go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.7.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Prepare free-tier signing material
        env:
          NCC_RELEASE_SIGN_KEY_BASE64: ${{ secrets.NCC_RELEASE_SIGN_KEY_BASE64 }}
          NCC_RELEASE_PUBKEY: ${{ vars.NCC_RELEASE_PUBKEY }}
          NCC_LINUX_GPG_PRIVATE_KEY_BASE64: ${{ secrets.NCC_LINUX_GPG_PRIVATE_KEY_BASE64 }}
          NCC_LINUX_GPG_KEY_ID: ${{ secrets.NCC_LINUX_GPG_KEY_ID }}
          NCC_LINUX_GPG_PASSPHRASE: ${{ secrets.NCC_LINUX_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          # Writes the key files, signs a test file with each key, and puts only
          # file names, the GPG key ID and the public key into GITHUB_ENV.
          bash scripts/release-signing-keys.sh "$RUNNER_TEMP" "$GITHUB_ENV"

      - name: Run scripts/binaryGO.txt (build + sign + SBOM + attestation)
        env:
          NODE_COMPILE_CACHE: ${{ runner.temp }}/node-compile-cache
        run: |
          set -euo pipefail
          bash scripts/binaryGO.txt

      - name: Verify dist/ inventory
        # Belt-and-suspenders: binaryGO.txt prints RELEASE_OK on
        # success, but we re-check the count here so the workflow
        # cannot accept a partial build that somehow snuck past.
        run: |
          set -euo pipefail
          test -f dist/checksums.txt
          test -s dist/checksums.txt.sig
          test -s dist/ncc-release-signing.gpg
          test -f dist/release-attestation.json
          test -s dist/upgrade-manifest.json
          # The detached signatures (*.asc) share the artifacts' names: count
          # them apart, or a signed build never has the expected totals.
          expect() { # expect COUNT DESCRIPTION FILE...
            local want="$1" what="$2"; shift 2
            [ "$#" -eq "$want" ] || { echo "::error::expected $want $what, found $#: $*"; exit 1; }
          }
          shopt -s nullglob extglob
          expect 6 stacks dist/ncc-v2-stack-!(*.asc)
          expect 18 binaries dist/ncc-@(orchestrator|api-server|ui-server)-!(*.asc)
          expect 2 "orchestrator signatures" dist/ncc-orchestrator-linux-*.asc
          expect 2 "stack signatures" dist/ncc-v2-stack-linux-*.asc
          gpg --batch --verify dist/ncc-orchestrator-linux-amd64.asc dist/ncc-orchestrator-linux-amd64
          gpg --batch --verify dist/ncc-v2-stack-linux-amd64.tar.gz.asc dist/ncc-v2-stack-linux-amd64.tar.gz
          echo "release inventory verified"

      - name: Stage the files to publish
        # release-assets/ is the one definition of what a release contains.
        run: bash scripts/stage-release-assets.sh dist release-assets

      - name: Generate SLSA build-provenance attestation
        # actions/attest-build-provenance@v4 (a wrapper over actions/attest) generates an in-toto
        # attestation that GitHub signs with a workload identity
        # certificate via Sigstore. End users verify with:
        #   gh attestation verify <file> --owner=<owner>
        # Without `gh`, the bundled signature can be verified with
        # cosign / cosign verify-blob-attestation. The attestation
        # binds the artifact set to this exact workflow run, this
        # repo, and this tag, providing supply-chain provenance that
        # survives mirror sites and CDN caches.
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          # Every file that is published, and nothing else.
          subject-path: release-assets/*

      - name: Hand the files to the publish job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: release-assets/
          if-no-files-found: error
          retention-days: 7

      - name: Remove signing material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/ncc-release-signing.key" "$RUNNER_TEMP/ncc-release-gpg.pass"
          rm -rf "$RUNNER_TEMP/ncc-release-gpg"

  publish:
    name: Draft, verify, publish
    needs: build
    # Manual (workflow_dispatch) rebuilds do not create a release.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write         # create/upload/publish the GitHub Release
      attestations: read      # gh attestation verify
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
      VERIFY_ATTEMPTS: "4"
    steps:
      - name: Checkout (scripts only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.ref }}
          persist-credentials: false

      - name: Download the built files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: release-assets

      - name: Create the draft release and upload the files
        run: |
          set -euo pipefail
          case "$(bash scripts/release-state.sh "$TAG")" in
            published)
              echo "::error::release $TAG is already published; refusing to modify it. Delete it or use a new tag."
              exit 1 ;;
            draft)
              echo "replacing leftover draft release $TAG"
              gh release delete "$TAG" --yes ;;
          esac
          notes=()
          if [ -f "release-assets/RELEASE_NOTES_${TAG}.md" ]; then
            notes=(--notes-file "release-assets/RELEASE_NOTES_${TAG}.md")
          fi
          kind="$(bash scripts/release-tag-check.sh "$TAG")"
          flags=()
          if [ "$kind" = prerelease=true ]; then
            flags=(--prerelease --latest=false)
          fi
          # --verify-tag: the tag must already exist; no target commit is sent.
          gh release create "$TAG" --draft --verify-tag --title "$TAG" --generate-notes "${notes[@]}" "${flags[@]}"
          gh release upload "$TAG" release-assets/*

      - name: Verify the uploaded draft (checksums, attestations, exact file set)
        run: |
          bash scripts/verify-published-release.sh --repo "$GH_REPO" \
            --workflow .github/workflows/release.yml \
            --expect-dir release-assets "$TAG"

      - name: Publish the release
        id: publish
        run: |
          set -euo pipefail
          if [ "$(bash scripts/release-tag-check.sh "$TAG")" = prerelease=true ]; then
            gh release edit "$TAG" --draft=false --prerelease --latest=false
          else
            gh release edit "$TAG" --draft=false
          fi
          echo "published=true" >> "$GITHUB_OUTPUT"

      - name: Verify the published signed update
        run: |
          set -euo pipefail
          chmod +x release-assets/ncc-orchestrator-linux-amd64
          release-assets/ncc-orchestrator-linux-amd64 verify --online \
            --release "$TAG" --require-signature

      - name: Verify the public release again
        run: |
          bash scripts/verify-published-release.sh --repo "$GH_REPO" \
            --workflow .github/workflows/release.yml \
            --expect-dir release-assets "$TAG"

      - name: Withdraw the release if verification failed
        if: failure() && steps.publish.outputs.published == 'true'
        run: |
          gh release edit "$TAG" --draft=true
          echo "::error::release $TAG failed post-publish verification and was turned back into a draft"

  images:
    name: Container images
    # A release published with GITHUB_TOKEN starts no other workflow, so the
    # image build is called from here. It runs after the release is verified;
    # a failed push does not withdraw it.
    needs: publish
    permissions:
      contents: read
    uses: ./.github/workflows/docker-publish.yml
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
