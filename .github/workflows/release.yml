name: Release

# Tag-driven release pipeline. Pushing a `v*` tag (e.g. v2.2.0) builds
# every binary + every stack archive via scripts/binaryGO.txt, generates SBOMs
# and a release-attestation.json, signs checksums.txt with an Ed25519 release
# key, signs Linux artifacts with GPG, attests the artifacts with GitHub
# Actions SLSA provenance, and publishes the result as a GitHub Release.
#
# What this gives release consumers:
#
#   1. SHA-256 manifest (checksums.txt) signed by the same provenance
#      attestation, so a single `gh attestation verify` covers every
#      artifact in the release.
#
#   2. CycloneDX 1.5 SBOMs (bom-*.cdx.json) for each binary; pluggable
#      into Trivy / Grype / Dependency-Track for CVE alerts.
#
#   3. release-attestation.json — a hand-rolled provenance document
#      that pairs with the SLSA attestation but is also human-readable
#      and tool-friendly without `gh` (good for air-gapped IT review).
#
# All steps run on stock GitHub-hosted runners. No self-hosted runner
# is involved at any point in the pipeline; that's a deliberate
# constraint so the SLSA attestation chain remains auditable end-to-end
# from a public, reproducible build environment.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag or commit to build"
        required: false
        default: ""

permissions:
  contents: write          # create/update GitHub Release
  id-token: write          # OIDC token for actions/attest-build-provenance
  attestations: write      # write the attestation back to the repo

jobs:
  build:
    name: Build, SBOM, attest, release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: release
    steps:
      - name: Checkout (tag or input ref)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
          # Full history is required so binaryGO.txt's git rev / dirty
          # detection matches what the developer would see locally.
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          check-latest: true
          cache: false

      - name: Setup Node (for frontend build)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "26.12.1" # >= 26.12.1: Oct 21 2026 Node security release; runner toolcache may lag
          # No dependency cache here: this job holds contents:write and an OIDC
          # token, so restoring a cache another run wrote is a poisoning path
          # into signed release artifacts.
          package-manager-cache: false

      - name: Install cyclonedx-gomod (SBOM generator)
        # Pinned version: bumping requires updating binaryGO.txt's
        # install hint comment too. cyclonedx-gomod is the canonical
        # CycloneDX SBOM tool maintained by the CycloneDX project.
        run: |
          go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.7.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Prepare free-tier signing material
        env:
          NCC_RELEASE_SIGN_KEY_BASE64: ${{ secrets.NCC_RELEASE_SIGN_KEY_BASE64 }}
          NCC_RELEASE_PUBKEY: ${{ vars.NCC_RELEASE_PUBKEY }}
          NCC_LINUX_GPG_PRIVATE_KEY_BASE64: ${{ secrets.NCC_LINUX_GPG_PRIVATE_KEY_BASE64 }}
          NCC_LINUX_GPG_KEY_ID: ${{ secrets.NCC_LINUX_GPG_KEY_ID }}
          NCC_LINUX_GPG_PASSPHRASE: ${{ secrets.NCC_LINUX_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          for name in NCC_RELEASE_SIGN_KEY_BASE64 NCC_RELEASE_PUBKEY NCC_LINUX_GPG_PRIVATE_KEY_BASE64 NCC_LINUX_GPG_KEY_ID NCC_LINUX_GPG_PASSPHRASE; do
            [ -n "${!name}" ] || { echo "::error::$name is required for a release"; exit 1; }
          done
          release_key="$RUNNER_TEMP/ncc-release-signing.key"
          printf '%s' "$NCC_RELEASE_SIGN_KEY_BASE64" | base64 --decode > "$release_key"
          chmod 600 "$release_key"
          gpg_home="$RUNNER_TEMP/ncc-release-gpg"
          install -d -m 700 "$gpg_home"
          printf '%s' "$NCC_LINUX_GPG_PRIVATE_KEY_BASE64" | base64 --decode | gpg --batch --homedir "$gpg_home" --import
          gpg --batch --homedir "$gpg_home" --list-secret-keys "$NCC_LINUX_GPG_KEY_ID" >/dev/null
          {
            echo "NCC_RELEASE_SIGN_KEY=$release_key"
            echo "NCC_RELEASE_PUBKEY=$NCC_RELEASE_PUBKEY"
            echo "GNUPGHOME=$gpg_home"
            echo "NCC_LINUX_GPG_KEY_ID=$NCC_LINUX_GPG_KEY_ID"
            echo "NCC_LINUX_GPG_PASSPHRASE=$NCC_LINUX_GPG_PASSPHRASE"
          } >> "$GITHUB_ENV"

      - name: Run scripts/binaryGO.txt (build + sign + SBOM + attestation)
        env:
          NODE_COMPILE_CACHE: ${{ runner.temp }}/node-compile-cache
        run: |
          set -euo pipefail
          bash scripts/binaryGO.txt

      - name: Verify dist/ inventory
        # Belt-and-suspenders: binaryGO.txt prints RELEASE_OK on
        # success, but we re-check the count here so the workflow
        # cannot accept a partial build that somehow snuck past.
        run: |
          set -euo pipefail
          test -f dist/checksums.txt
          test -s dist/checksums.txt.sig
          test -s dist/ncc-release-signing.gpg
          test -f dist/release-attestation.json
          ls dist/ncc-v2-stack-* | wc -l | grep -q 6
          ls dist/ncc-orchestrator-* dist/ncc-api-server-* dist/ncc-ui-server-* | wc -l | grep -q 18
          ls dist/ncc-orchestrator-linux-*.asc | wc -l | grep -q 2
          ls dist/ncc-v2-stack-linux-*.asc | wc -l | grep -q 2
          gpg --batch --verify dist/ncc-orchestrator-linux-amd64.asc dist/ncc-orchestrator-linux-amd64
          gpg --batch --verify dist/ncc-v2-stack-linux-amd64.tar.gz.asc dist/ncc-v2-stack-linux-amd64.tar.gz
          echo "release inventory verified"

      - name: Generate SLSA build-provenance attestation
        # actions/attest-build-provenance@v4 (a wrapper over actions/attest) generates an in-toto
        # attestation that GitHub signs with a workload identity
        # certificate via Sigstore. End users verify with:
        #   gh attestation verify <file> --owner=<owner>
        # Without `gh`, the bundled signature can be verified with
        # cosign / cosign verify-blob-attestation. The attestation
        # binds the artifact set to this exact workflow run, this
        # repo, and this tag, providing supply-chain provenance that
        # survives mirror sites and CDN caches.
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: |
            dist/ncc-orchestrator-*
            dist/ncc-api-server-*
            dist/ncc-ui-server-*
            dist/ncc-v2-stack-*
            dist/checksums.txt
            dist/checksums.txt.sig
            dist/ncc-release-signing.gpg
            dist/release-attestation.json
            dist/bom-*.cdx.json
            dist/*.asc

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        # Only fire on tag pushes, not on workflow_dispatch (manual
        # rebuilds don't need a new Release; they regenerate
        # attestations against the existing tag).
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          # body-path is the dist-bundled release notes that
          # binaryGO.txt copies in step 5. Falls back to the auto-
          # generated release body if the file isn't present.
          body_path: dist/RELEASE_NOTES_${{ github.ref_name }}.md
          generate_release_notes: true
          files: |
            dist/ncc-orchestrator-*
            dist/ncc-v2-stack-*
            dist/example_config.yaml
            dist/RELEASE_NOTES_*.md
            dist/checksums.txt
            dist/checksums.txt.sig
            dist/ncc-release-signing.gpg
            dist/release-attestation.json
            dist/bom-*.cdx.json
            dist/*.asc

      - name: Verify the published signed update
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          dist/ncc-orchestrator-linux-amd64 verify --online \
            --release "$GITHUB_REF_NAME" --require-signature

      - name: Remove signing material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/ncc-release-signing.key"
          rm -rf "$RUNNER_TEMP/ncc-release-gpg"
